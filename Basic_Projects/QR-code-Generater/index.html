<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>
<link rel="shortcut icon" href="/Basic_Projects/QR-code-Generater/qrcode.png" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/Basic_Projects/QR-code-Generater/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-cube"></i></div>
            QR Forge
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="historyBtn" title="History" aria-label="Open history"><i class="fas fa-clock-rotate-left"></i></button>
            <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
        </div>
    </div>
</header>

<main class="workspace">
    <aside class="controls-panel" role="form" aria-label="QR Code settings">
        <div class="stitle">Content Type</div>
        <div class="type-tabs" role="tablist">
            <button class="type-tab active" data-type="text" role="tab" aria-selected="true"><i class="fas fa-link"></i> Text</button>
            <button class="type-tab" data-type="wifi" role="tab"><i class="fas fa-wifi"></i> WiFi</button>
            <button class="type-tab" data-type="email" role="tab"><i class="fas fa-envelope"></i> Email</button>
            <button class="type-tab" data-type="phone" role="tab"><i class="fas fa-phone"></i> Phone</button>
            <button class="type-tab" data-type="sms" role="tab"><i class="fas fa-comment-dots"></i> SMS</button>
            <button class="type-tab" data-type="vcard" role="tab"><i class="fas fa-address-card"></i> vCard</button>
        </div>

        <!-- Text form -->
        <div id="form-text" class="type-form active">
            <div class="field">
                <label for="txtInput">Text or URL</label>
                <textarea id="txtInput" placeholder="https://example.com" rows="3"></textarea>
            </div>
        </div>

        <!-- WiFi form -->
        <div id="form-wifi" class="type-form">
            <div class="field">
                <label for="wifiSsid">Network Name (SSID)</label>
                <input type="text" id="wifiSsid" placeholder="MyNetwork">
            </div>
            <div class="field">
                <label for="wifiPass">Password</label>
                <input type="text" id="wifiPass" placeholder="password123">
            </div>
            <div class="field">
                <label for="wifiEnc">Encryption</label>
                <select id="wifiEnc">
                    <option value="WPA" selected>WPA/WPA2</option>
                    <option value="WEP">WEP</option>
                    <option value="nopass">None</option>
                </select>
            </div>
            <label class="toggle-row"><input type="checkbox" id="wifiHidden"> Hidden network</label>
        </div>

        <!-- Email form -->
        <div id="form-email" class="type-form">
            <div class="field">
                <label for="emailTo">Recipient</label>
                <input type="email" id="emailTo" placeholder="name@example.com">
            </div>
            <div class="field">
                <label for="emailSubj">Subject</label>
                <input type="text" id="emailSubj" placeholder="Hello there">
            </div>
            <div class="field">
                <label for="emailBody">Body</label>
                <textarea id="emailBody" placeholder="Your message..." rows="3"></textarea>
            </div>
        </div>

        <!-- Phone form -->
        <div id="form-phone" class="type-form">
            <div class="field">
                <label for="phoneNum">Phone Number</label>
                <input type="tel" id="phoneNum" placeholder="+1 234 567 8900">
            </div>
        </div>

        <!-- SMS form -->
        <div id="form-sms" class="type-form">
            <div class="field">
                <label for="smsNum">Phone Number</label>
                <input type="tel" id="smsNum" placeholder="+1 234 567 8900">
            </div>
            <div class="field">
                <label for="smsMsg">Message</label>
                <textarea id="smsMsg" placeholder="Your SMS text..." rows="3"></textarea>
            </div>
        </div>

        <!-- vCard form -->
        <div id="form-vcard" class="type-form">
            <div class="field-row">
                <div class="field"><label for="vcFirst">First Name</label><input type="text" id="vcFirst" placeholder="John"></div>
                <div class="field"><label for="vcLast">Last Name</label><input type="text" id="vcLast" placeholder="Doe"></div>
            </div>
            <div class="field"><label for="vcPhone">Phone</label><input type="tel" id="vcPhone" placeholder="+1 234 567 8900"></div>
            <div class="field"><label for="vcEmail">Email</label><input type="email" id="vcEmail" placeholder="john@example.com"></div>
            <div class="field"><label for="vcOrg">Organization</label><input type="text" id="vcOrg" placeholder="Acme Inc."></div>
            <div class="field"><label for="vcUrl">Website</label><input type="url" id="vcUrl" placeholder="https://example.com"></div>
            <div class="field"><label for="vcAddr">Address</label><input type="text" id="vcAddr" placeholder="123 Main St, City"></div>
        </div>

        <div class="stitle">Module Style</div>
        <div class="style-options">
            <button class="style-btn active" data-style="square" aria-label="Square modules">
                <svg viewBox="0 0 36 36" fill="none"><rect x="4" y="4" width="10" height="10" rx="1" fill="currentColor"/><rect x="22" y="4" width="10" height="10" rx="1" fill="currentColor"/><rect x="4" y="22" width="10" height="10" rx="1" fill="currentColor"/><rect x="22" y="22" width="4" height="4" rx="1" fill="currentColor" opacity="0.5"/><rect x="28" y="28" width="4" height="4" rx="1" fill="currentColor" opacity="0.5"/></svg>
                Square
            </button>
            <button class="style-btn" data-style="rounded" aria-label="Rounded modules">
                <svg viewBox="0 0 36 36" fill="none"><rect x="4" y="4" width="10" height="10" rx="3" fill="currentColor"/><rect x="22" y="4" width="10" height="10" rx="3" fill="currentColor"/><rect x="4" y="22" width="10" height="10" rx="3" fill="currentColor"/><rect x="22" y="22" width="4" height="4" rx="2" fill="currentColor" opacity="0.5"/><rect x="28" y="28" width="4" height="4" rx="2" fill="currentColor" opacity="0.5"/></svg>
                Rounded
            </button>
            <button class="style-btn" data-style="dots" aria-label="Dot modules">
                <svg viewBox="0 0 36 36" fill="none"><circle cx="9" cy="9" r="5" fill="currentColor"/><circle cx="27" cy="9" r="5" fill="currentColor"/><circle cx="9" cy="27" r="5" fill="currentColor"/><circle cx="24" cy="24" r="2" fill="currentColor" opacity="0.5"/><circle cx="30" cy="30" r="2" fill="currentColor" opacity="0.5"/></svg>
                Dots
            </button>
        </div>

        <div class="stitle">Colors</div>
        <label class="toggle-label"><input type="checkbox" id="gradientToggle"> Use gradient fill</label>
        <div class="color-row">
            <div class="color-field fg-field" id="fgField">
                <label>Foreground</label>
                <input type="color" id="fgColor" value="#000000">
            </div>
            <div class="color-field gradient-fields" id="gradStartField">
                <label>Start</label>
                <input type="color" id="gradStart" value="#C94A2E">
            </div>
            <div class="color-field gradient-fields" id="gradEndField">
                <label>End</label>
                <input type="color" id="gradEnd" value="#F0A030">
            </div>
            <div class="color-field">
                <label>Background</label>
                <input type="color" id="bgColor" value="#ffffff">
            </div>
        </div>
        <div class="preset-grid" id="presetGrid"></div>

        <div class="stitle">Dimensions</div>
        <div class="slider-group">
            <div class="slider-header"><label>Size</label><span class="slider-val" id="sizeVal">300px</span></div>
            <input type="range" id="sizeSlider" min="120" max="800" value="300" step="10">
        </div>
        <div class="slider-group">
            <div class="slider-header"><label>Margin</label><span class="slider-val" id="marginVal">2</span></div>
            <input type="range" id="marginSlider" min="0" max="6" value="2" step="1">
        </div>

        <div class="stitle">Error Correction</div>
        <div class="ec-options">
            <button class="ec-btn" data-level="L"><span class="ec-label">L</span><div class="ec-bar"><div class="ec-fill" style="width:25%"></div></div><span class="ec-desc">7% recover</span></button>
            <button class="ec-btn active" data-level="M"><span class="ec-label">M</span><div class="ec-bar"><div class="ec-fill" style="width:50%"></div></div><span class="ec-desc">15% recover</span></button>
            <button class="ec-btn" data-level="Q"><span class="ec-label">Q</span><div class="ec-bar"><div class="ec-fill" style="width:75%"></div></div><span class="ec-desc">25% recover</span></button>
            <button class="ec-btn" data-level="H"><span class="ec-label">H</span><div class="ec-bar"><div class="ec-fill" style="width:100%"></div></div><span class="ec-desc">30% recover</span></button>
        </div>

        <div class="stitle">Logo Overlay</div>
        <div class="logo-area" id="logoArea">
            <i class="fas fa-cloud-arrow-up"></i>
            <span>Click or drop an image</span>
            <input type="file" id="logoInput" accept="image/*" aria-label="Upload logo image">
        </div>
        <div class="logo-preview" id="logoPreview">
            <img id="logoThumb" src="" alt="Logo preview">
            <div class="logo-preview-info">
                <p id="logoName">logo.png</p>
                <span id="logoSizeInfo">0 KB</span>
            </div>
            <button class="logo-remove" id="logoRemove" aria-label="Remove logo"><i class="fas fa-xmark"></i></button>
        </div>
        <div class="slider-group" id="logoSizeGroup" style="display:none; margin-top:10px;">
            <div class="slider-header"><label>Logo Size</label><span class="slider-val" id="logoSizeVal">20%</span></div>
            <input type="range" id="logoSizeSlider" min="10" max="35" value="20" step="1">
        </div>
    </aside>

    <section class="preview-panel">
        <div class="preview-card">
            <div class="preview-stage" id="previewStage">
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-qrcode"></i>
                    <p>Enter content to generate</p>
                </div>
                <canvas id="qrCanvas" class="hidden"></canvas>
            </div>
            <div class="action-bar">
                <button class="action-btn primary" id="dlPng"><i class="fas fa-download"></i> PNG</button>
                <button class="action-btn" id="dlSvg"><i class="fas fa-file-code"></i> SVG</button>
                <button class="action-btn" id="copyBtn"><i class="fas fa-copy"></i> Copy</button>
            </div>
            <div class="qr-info hidden" id="qrInfo">
                <span class="qr-info-item">Version <strong id="infoVer">-</strong></span>
                <span class="qr-info-item">Modules <strong id="infoMod">-</strong></span>
                <span class="qr-info-item">Data <strong id="infoLen">-</strong></span>
            </div>
        </div>
    </section>
</main>

<!-- History drawer -->
<div class="history-overlay" id="historyOverlay">
    <div class="history-drawer">
        <div class="history-header">
            <h3>History</h3>
            <button class="icon-btn" id="closeHist" aria-label="Close history"><i class="fas fa-xmark"></i></button>
        </div>
        <div class="history-list" id="historyList"></div>
        <div class="history-footer">
            <button class="clear-hist-btn" id="clearHist">Clear All History</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="/Basic_Projects/QR-code-Generater/script.js"></script>
</body>
</html>
