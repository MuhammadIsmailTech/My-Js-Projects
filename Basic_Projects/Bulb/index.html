<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumina — Interactive Electric Bulb</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #06060c;
    --bg-panel: rgba(14, 14, 24, 0.85);
    --fg: #e8e6f0;
    --muted: #6b6880;
    --accent: #ffb347;
    --accent-hot: #ff8c00;
    --accent-cool: #b8d4ff;
    --card: rgba(20, 20, 36, 0.7);
    --border: rgba(255, 179, 71, 0.12);
    --glow-warm: rgba(255, 160, 40, 0.6);
    --glow-cool: rgba(180, 210, 255, 0.5);
    --bulb-color: #ffcc66;
    --filament-color: #ff9933;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Ambient background */
  .ambient {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .ambient-glow {
    position: absolute;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow-warm) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.8s ease, background 0.8s ease;
    filter: blur(60px);
  }

  .ambient-glow.on { opacity: 1; }

  .ambient-particles {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  .particle {
    position: absolute;
    width: 3px; height: 3px;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0;
    transition: opacity 1s ease;
  }

  .particle.on {
    opacity: 0.4;
    animation: float-particle 6s ease-in-out infinite;
  }

  @keyframes float-particle {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.2; }
    50% { transform: translateY(-40px) scale(1.5); opacity: 0.6; }
  }

  /* Wire */
  .wire {
    position: relative;
    z-index: 2;
    width: 2px;
    height: 80px;
    background: linear-gradient(to bottom, rgba(100,100,120,0.3), rgba(100,100,120,0.7));
    margin-bottom: -2px;
  }

  /* Main bulb container */
  .bulb-scene {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .bulb-wrapper {
    position: relative;
    width: 200px;
    height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Bulb glass */
  .bulb-glass {
    position: relative;
    width: 180px;
    height: 200px;
    border-radius: 50% 50% 35% 35%;
    background: rgba(255, 255, 255, 0.03);
    border: 1.5px solid rgba(255, 255, 255, 0.08);
    overflow: hidden;
    transition: background 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease;
  }

  .bulb-glass.on {
    background: radial-gradient(ellipse at 50% 40%, rgba(255,220,130,0.35) 0%, rgba(255,180,60,0.1) 60%, transparent 100%);
    border-color: rgba(255, 200, 100, 0.25);
  }

  .bulb-glass .highlight {
    position: absolute;
    top: 15%;
    left: 20%;
    width: 30%;
    height: 20%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.12) 0%, transparent 70%);
    border-radius: 50%;
    transform: rotate(-20deg);
    transition: opacity 0.5s;
  }

  .bulb-glass.on .highlight {
    background: radial-gradient(ellipse, rgba(255,255,255,0.25) 0%, transparent 70%);
  }

  /* Filament */
  .filament-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -45%);
    width: 60px;
    height: 80px;
  }

  .filament {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
  }

  .filament svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .filament-path {
    fill: none;
    stroke: rgba(80, 75, 65, 0.6);
    stroke-width: 2;
    stroke-linecap: round;
    transition: stroke 0.5s ease, filter 0.5s ease;
  }

  .filament-path.on {
    stroke: var(--filament-color);
    filter: drop-shadow(0 0 6px var(--accent)) drop-shadow(0 0 12px var(--accent-hot));
  }

  .filament-path.flicker {
    animation: filament-flicker 0.1s ease infinite alternate;
  }

  @keyframes filament-flicker {
    0% { stroke: var(--filament-color); filter: drop-shadow(0 0 6px var(--accent)); }
    50% { stroke: #cc7722; filter: drop-shadow(0 0 3px #cc7722); }
    100% { stroke: var(--filament-color); filter: drop-shadow(0 0 8px var(--accent-hot)); }
  }

  /* Bulb outer glow */
  .bulb-outer-glow {
    position: absolute;
    top: -30px;
    left: -30px;
    width: 240px;
    height: 260px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease, box-shadow 0.6s ease;
  }

  .bulb-outer-glow.on {
    opacity: 1;
    box-shadow:
      0 0 40px rgba(255,180,60,0.3),
      0 0 80px rgba(255,160,40,0.2),
      0 0 140px rgba(255,140,20,0.1);
  }

  /* Light rays */
  .light-rays {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 500px;
    height: 500px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .light-rays.on {
    opacity: 1;
    animation: rays-rotate 20s linear infinite;
  }

  @keyframes rays-rotate {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  .ray {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2px;
    height: 200px;
    transform-origin: top center;
    background: linear-gradient(to bottom, rgba(255,200,100,0.15), transparent);
  }

  /* Screw base */
  .screw-base {
    position: relative;
    width: 72px;
    margin-top: -4px;
    z-index: 3;
  }

  .screw-ring {
    width: 72px;
    height: 12px;
    border-radius: 2px;
    background: linear-gradient(to bottom, #8a8a9a, #5a5a6a, #6a6a7a);
    border: 1px solid rgba(255,255,255,0.05);
    position: relative;
  }

  .screw-ring::before {
    content: '';
    position: absolute;
    left: 4px; right: 4px;
    top: 50%;
    height: 1px;
    background: rgba(0,0,0,0.3);
  }

  .screw-ring:nth-child(odd) {
    width: 68px;
    margin: 0 auto;
  }

  .screw-tip {
    width: 40px;
    height: 14px;
    margin: 0 auto;
    background: linear-gradient(to bottom, #5a5a6a, #3a3a4a);
    border-radius: 0 0 50% 50%;
    border: 1px solid rgba(255,255,255,0.03);
  }

  /* Contact point */
  .contact-point {
    width: 16px;
    height: 6px;
    margin: 0 auto;
    background: #555;
    border-radius: 0 0 50% 50%;
    margin-top: -1px;
  }

  /* Status label */
  .status-label {
    margin-top: 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 0.5s ease;
  }

  .status-label.on {
    color: var(--accent);
  }

  /* Control panel */
  .controls {
    position: relative;
    z-index: 10;
    width: min(520px, 92vw);
    margin-top: 48px;
    margin-bottom: 40px;
    padding: 28px 32px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .controls-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .controls-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--fg);
  }

  .power-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .power-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #333;
    transition: background 0.4s, box-shadow 0.4s;
  }

  .power-dot.on {
    background: #4ade80;
    box-shadow: 0 0 8px rgba(74, 222, 128, 0.5);
  }

  .control-group {
    margin-bottom: 22px;
  }

  .control-group:last-child { margin-bottom: 0; }

  .control-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .control-label span {
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .control-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    transition: color 0.4s;
  }

  /* Custom range slider */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.06);
    outline: none;
    transition: background 0.3s;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--bg);
    box-shadow: 0 0 10px rgba(255,179,71,0.3);
    cursor: pointer;
    transition: box-shadow 0.3s, transform 0.2s;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
    box-shadow: 0 0 16px rgba(255,179,71,0.5);
  }

  input[type="range"]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--bg);
    box-shadow: 0 0 10px rgba(255,179,71,0.3);
    cursor: pointer;
  }

  /* Color temperature buttons */
  .temp-buttons {
    display: flex;
    gap: 8px;
  }

  .temp-btn {
    flex: 1;
    padding: 10px 0;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    background: rgba(255,255,255,0.02);
    color: var(--muted);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .temp-btn:hover {
    border-color: rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
  }

  .temp-btn.active {
    border-color: var(--accent);
    background: rgba(255,179,71,0.08);
    color: var(--accent);
  }

  .temp-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.1);
  }

  .temp-btn.active .temp-dot {
    border-color: transparent;
  }

  .temp-dot.warm { background: #ffaa44; }
  .temp-dot.neutral { background: #ffe4b5; }
  .temp-dot.cool { background: #b8d4ff; }
  .temp-dot.daylight { background: #ffffff; }

  /* Toggle switches row */
  .toggle-row {
    display: flex;
    gap: 12px;
  }

  .toggle-card {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 10px;
    transition: border-color 0.3s;
  }

  .toggle-card:hover {
    border-color: rgba(255,255,255,0.1);
  }

  .toggle-card-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }

  .toggle-switch {
    position: relative;
    width: 40px;
    height: 22px;
    background: rgba(255,255,255,0.08);
    border-radius: 11px;
    cursor: pointer;
    transition: background 0.3s;
    border: none;
    outline: none;
    padding: 0;
  }

  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #666;
    transition: transform 0.3s ease, background 0.3s;
  }

  .toggle-switch.on {
    background: rgba(255,179,71,0.25);
  }

  .toggle-switch.on::after {
    transform: translateX(18px);
    background: var(--accent);
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.04);
  }

  .stat-item {
    flex: 1;
    text-align: center;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    color: var(--fg);
    transition: color 0.3s;
  }

  .stat-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    padding: 12px 24px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    backdrop-filter: blur(16px);
    font-size: 13px;
    color: var(--fg);
    z-index: 100;
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* Keyboard hint */
  .key-hint {
    position: fixed;
    bottom: 16px;
    right: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.15);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .key-hint kbd {
    padding: 2px 7px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    font-size: 10px;
    background: rgba(255,255,255,0.03);
  }

  /* Power button overlay */
  .power-btn {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.1);
    background: var(--bg-panel);
    backdrop-filter: blur(12px);
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    z-index: 20;
    outline: none;
  }

  .power-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 20px rgba(255,179,71,0.15);
  }

  .power-btn.on {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(255,179,71,0.1);
  }

  /* Timer display */
  .timer-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 8px;
    min-height: 18px;
    transition: color 0.3s;
  }

  .timer-display.active {
    color: var(--accent);
  }

  /* Responsive */
  @media (max-width: 560px) {
    .bulb-wrapper {
      width: 160px;
      height: 230px;
    }
    .bulb-glass {
      width: 150px;
      height: 170px;
    }
    .bulb-outer-glow {
      width: 210px;
      height: 230px;
    }
    .light-rays {
      width: 360px;
      height: 360px;
    }
    .ray { height: 140px; }
    .screw-base { width: 60px; }
    .screw-ring { width: 60px; }
    .screw-ring:nth-child(odd) { width: 56px; }
    .screw-tip { width: 34px; }
    .controls { padding: 20px; }
    .stats-bar { flex-wrap: wrap; }
    .stat-item { min-width: 45%; }
    .key-hint { display: none; }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<!-- Ambient lighting background -->
<div class="ambient" aria-hidden="true">
  <div class="ambient-glow" id="ambientGlow"></div>
  <div class="ambient-particles" id="ambientParticles"></div>
</div>

<!-- Wire -->
<div class="wire" aria-hidden="true"></div>

<!-- Bulb scene -->
<div class="bulb-scene" id="bulbScene" role="button" aria-label="Toggle light bulb" tabindex="0">
  <div class="bulb-wrapper">
    <div class="light-rays" id="lightRays"></div>
    <div class="bulb-outer-glow" id="bulbOuterGlow"></div>
    <div class="bulb-glass" id="bulbGlass">
      <div class="highlight"></div>
      <div class="filament-container">
        <div class="filament">
          <svg viewBox="0 0 60 80" preserveAspectRatio="xMidYMid meet">
            <path class="filament-path" id="filamentPath" d="
              M 10 75
              L 10 55
              Q 10 45, 20 40
              Q 30 35, 30 25
              Q 30 15, 20 10
              L 20 5
              M 50 75
              L 50 55
              Q 50 45, 40 40
              Q 30 35, 30 25
              Q 30 15, 40 10
              L 40 5
              M 20 5
              Q 25 2, 30 5
              Q 35 2, 40 5
            "/>
          </svg>
        </div>
      </div>
    </div>
    <div class="screw-base" aria-hidden="true">
      <div class="screw-ring"></div>
      <div class="screw-ring"></div>
      <div class="screw-ring"></div>
      <div class="screw-ring"></div>
      <div class="screw-ring"></div>
      <div class="screw-tip"></div>
      <div class="contact-point"></div>
    </div>
  </div>
  <div class="status-label" id="statusLabel">OFF</div>
</div>

<!-- Control panel -->
<section class="controls" aria-label="Bulb controls">
  <div class="controls-header">
    <span class="controls-title">Control Panel</span>
    <div class="power-indicator">
      <div class="power-dot" id="powerDot"></div>
      <span id="powerText">Standby</span>
    </div>
  </div>

  <!-- Brightness -->
  <div class="control-group">
    <div class="control-label">
      <span><i class="fa-solid fa-sun" style="margin-right:6px;opacity:0.5"></i>Brightness</span>
      <span class="control-value" id="brightnessValue">100%</span>
    </div>
    <input type="range" id="brightnessSlider" min="5" max="100" value="100" aria-label="Brightness level">
  </div>

  <!-- Color Temperature -->
  <div class="control-group">
    <div class="control-label">
      <span><i class="fa-solid fa-temperature-half" style="margin-right:6px;opacity:0.5"></i>Color Temperature</span>
      <span class="control-value" id="tempValue">2700K</span>
    </div>
    <div class="temp-buttons" id="tempButtons">
      <button class="temp-btn active" data-temp="2700" data-label="2700K" aria-label="Warm white 2700K">
        <div class="temp-dot warm"></div>
        Warm
      </button>
      <button class="temp-btn" data-temp="3500" data-label="3500K" aria-label="Neutral 3500K">
        <div class="temp-dot neutral"></div>
        Neutral
      </button>
      <button class="temp-btn" data-temp="5000" data-label="5000K" aria-label="Cool 5000K">
        <div class="temp-dot cool"></div>
        Cool
      </button>
      <button class="temp-btn" data-temp="6500" data-label="6500K" aria-label="Daylight 6500K">
        <div class="temp-dot daylight"></div>
        Daylight
      </button>
    </div>
  </div>

  <!-- Toggles -->
  <div class="control-group">
    <div class="toggle-row">
      <div class="toggle-card">
        <span class="toggle-card-label">Flicker</span>
        <button class="toggle-switch" id="flickerToggle" role="switch" aria-checked="false" aria-label="Toggle flicker effect"></button>
      </div>
      <div class="toggle-card">
        <span class="toggle-card-label">Auto Off</span>
        <button class="toggle-switch" id="autoOffToggle" role="switch" aria-checked="false" aria-label="Toggle auto off timer"></button>
      </div>
      <div class="toggle-card">
        <span class="toggle-card-label">Pulse</span>
        <button class="toggle-switch" id="pulseToggle" role="switch" aria-checked="false" aria-label="Toggle pulse effect"></button>
      </div>
    </div>
    <div class="timer-display" id="timerDisplay"></div>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-value" id="wattDisplay">0W</div>
      <div class="stat-label">Power</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="lumenDisplay">0 lm</div>
      <div class="stat-label">Lumens</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="tempDisplay">--</div>
      <div class="stat-label">Temp</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="uptimeDisplay">0s</div>
      <div class="stat-label">Uptime</div>
    </div>
  </div>
</section>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Keyboard hint -->
<div class="key-hint" aria-hidden="true">
  <kbd>Space</kbd> Toggle &nbsp; <kbd>+</kbd><kbd>-</kbd> Brightness
</div>

<script>
  // ========== State ==========
  const state = {
    isOn: false,
    brightness: 100,
    temperature: 2700,
    flicker: false,
    autoOff: false,
    pulse: false,
    autoOffSeconds: 60,
    uptime: 0,
    uptimeInterval: null,
    autoOffInterval: null,
  };

  // ========== DOM References ==========
  const $ = (sel) => document.querySelector(sel);
  const bulbScene = $('#bulbScene');
  const bulbGlass = $('#bulbGlass');
  const bulbOuterGlow = $('#bulbOuterGlow');
  const filamentPath = $('#filamentPath');
  const ambientGlow = $('#ambientGlow');
  const lightRays = $('#lightRays');
  const statusLabel = $('#statusLabel');
  const powerDot = $('#powerDot');
  const powerText = $('#powerText');
  const brightnessSlider = $('#brightnessSlider');
  const brightnessValue = $('#brightnessValue');
  const tempValue = $('#tempValue');
  const tempButtons = $('#tempButtons');
  const flickerToggle = $('#flickerToggle');
  const autoOffToggle = $('#autoOffToggle');
  const pulseToggle = $('#pulseToggle');
  const timerDisplay = $('#timerDisplay');
  const wattDisplay = $('#wattDisplay');
  const lumenDisplay = $('#lumenDisplay');
  const tempDisplay = $('#tempDisplay');
  const uptimeDisplay = $('#uptimeDisplay');
  const toast = $('#toast');
  const ambientParticles = $('#ambientParticles');

  // ========== Color temperature presets ==========
  const tempPresets = {
    2700: {
      bulb: 'rgba(255,204,100,0.35)',
      filament: '#ff9933',
      accent: '#ffb347',
      glow: 'rgba(255,160,40,0.6)',
      outerGlow: 'rgba(255,180,60,0.3), rgba(255,160,40,0.2), rgba(255,140,20,0.1)',
      ambientGlow: 'rgba(255,160,40,0.6)',
      ray: 'rgba(255,200,100,0.15)',
      particle: '#ffb347',
    },
    3500: {
      bulb: 'rgba(255,225,170,0.3)',
      filament: '#ffbb66',
      accent: '#ffd080',
      glow: 'rgba(255,200,100,0.5)',
      outerGlow: 'rgba(255,210,130,0.25), rgba(255,190,100,0.15), rgba(255,170,80,0.08)',
      ambientGlow: 'rgba(255,200,100,0.5)',
      ray: 'rgba(255,220,150,0.12)',
      particle: '#ffd080',
    },
    5000: {
      bulb: 'rgba(220,235,255,0.25)',
      filament: '#ccddef',
      accent: '#b8d4ff',
      glow: 'rgba(180,210,255,0.4)',
      outerGlow: 'rgba(180,210,255,0.2), rgba(160,200,255,0.12), rgba(140,190,255,0.06)',
      ambientGlow: 'rgba(180,210,255,0.4)',
      ray: 'rgba(200,220,255,0.1)',
      particle: '#b8d4ff',
    },
    6500: {
      bulb: 'rgba(240,245,255,0.22)',
      filament: '#dde6f0',
      accent: '#e0eaff',
      glow: 'rgba(220,235,255,0.35)',
      outerGlow: 'rgba(220,235,255,0.18), rgba(210,230,255,0.1), rgba(200,225,255,0.05)',
      ambientGlow: 'rgba(220,235,255,0.35)',
      ray: 'rgba(230,240,255,0.08)',
      particle: '#e0eaff',
    },
  };

  // ========== Initialize light rays ==========
  function createRays() {
    const rayCount = 24;
    for (let i = 0; i < rayCount; i++) {
      const ray = document.createElement('div');
      ray.className = 'ray';
      ray.style.transform = `rotate(${(360 / rayCount) * i}deg)`;
      lightRays.appendChild(ray);
    }
  }
  createRays();

  // ========== Initialize particles ==========
  function createParticles() {
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = `${Math.random() * 100}%`;
      p.style.top = `${20 + Math.random() * 50}%`;
      p.style.animationDelay = `${Math.random() * 6}s`;
      p.style.animationDuration = `${4 + Math.random() * 4}s`;
      p.style.width = `${2 + Math.random() * 3}px`;
      p.style.height = p.style.width;
      ambientParticles.appendChild(p);
    }
  }
  createParticles();

  // ========== Toast ==========
  let toastTimeout;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ========== Apply visual state ==========
  function applyVisuals() {
    const preset = tempPresets[state.temperature];
    const b = state.isOn ? state.brightness / 100 : 0;

    // CSS custom property for brightness multiplier
    document.documentElement.style.setProperty('--current-brightness', b);

    // Bulb glass
    if (state.isOn) {
      bulbGlass.classList.add('on');
      bulbGlass.style.background = `radial-gradient(ellipse at 50% 40%, ${preset.bulb} 0%, transparent 100%)`;
      bulbGlass.style.opacity = 0.4 + b * 0.6;
    } else {
      bulbGlass.classList.remove('on');
      bulbGlass.style.background = 'rgba(255,255,255,0.03)';
      bulbGlass.style.opacity = 1;
    }

    // Filament
    if (state.isOn) {
      filamentPath.classList.add('on');
      filamentPath.style.stroke = preset.filament;
      filamentPath.style.opacity = 0.5 + b * 0.5;
    } else {
      filamentPath.classList.remove('on');
      filamentPath.style.stroke = 'rgba(80,75,65,0.6)';
      filamentPath.style.opacity = 1;
    }

    // Flicker
    if (state.flicker && state.isOn) {
      filamentPath.classList.add('flicker');
    } else {
      filamentPath.classList.remove('flicker');
    }

    // Pulse
    if (state.pulse && state.isOn) {
      bulbGlass.style.animation = `pulse-glow 2s ease-in-out infinite`;
    } else {
      bulbGlass.style.animation = 'none';
    }

    // Outer glow
    if (state.isOn) {
      bulbOuterGlow.classList.add('on');
      const glowParts = preset.outerGlow.split(', ').map(g => {
        const match = g.match(/rgba?\(([^)]+)\)/);
        if (!match) return g;
        const nums = match[1].split(',').map(n => parseFloat(n.trim()));
        return `rgba(${nums[0]},${nums[1]},${nums[2]},${nums[3] * b})`;
      });
      bulbOuterGlow.style.boxShadow = glowParts.join(', ');
    } else {
      bulbOuterGlow.classList.remove('on');
      bulbOuterGlow.style.boxShadow = 'none';
    }

    // Ambient glow
    if (state.isOn) {
      ambientGlow.classList.add('on');
      ambientGlow.style.opacity = b * 0.8;
      ambientGlow.style.background = `radial-gradient(circle, ${preset.ambientGlow} 0%, transparent 70%)`;
    } else {
      ambientGlow.classList.remove('on');
    }

    // Light rays
    if (state.isOn) {
      lightRays.classList.add('on');
      lightRays.style.opacity = b * 0.6;
      lightRays.querySelectorAll('.ray').forEach(ray => {
        ray.style.background = `linear-gradient(to bottom, ${preset.ray}, transparent)`;
      });
    } else {
      lightRays.classList.remove('on');
    }

    // Particles
    ambientParticles.querySelectorAll('.particle').forEach(p => {
      if (state.isOn) {
        p.classList.add('on');
        p.style.background = preset.particle;
        p.style.opacity = b * 0.5;
      } else {
        p.classList.remove('on');
      }
    });

    // Status
    statusLabel.textContent = state.isOn ? 'ON' : 'OFF';
    statusLabel.classList.toggle('on', state.isOn);

    // Power indicator
    powerDot.classList.toggle('on', state.isOn);
    powerText.textContent = state.isOn ? 'Active' : 'Standby';

    // Stats
    const watts = state.isOn ? Math.round((state.brightness / 100) * 10) : 0;
    const lumens = state.isOn ? Math.round((state.brightness / 100) * 800) : 0;
    wattDisplay.textContent = `${watts}W`;
    lumenDisplay.textContent = `${lumens} lm`;
    tempDisplay.textContent = state.isOn ? `${state.temperature}K` : '--';

    // Slider track fill
    const pct = state.brightness;
    brightnessSlider.style.background = `linear-gradient(to right, ${preset.accent} 0%, ${preset.accent} ${pct}%, rgba(255,255,255,0.06) ${pct}%, rgba(255,255,255,0.06) 100%)`;
  }

  // ========== Toggle bulb ==========
  function toggleBulb() {
    state.isOn = !state.isOn;
    if (state.isOn) {
      startUptime();
    } else {
      stopUptime();
      stopAutoOff();
    }
    applyVisuals();
    showToast(state.isOn ? 'Light turned on' : 'Light turned off');
  }

  // ========== Uptime ==========
  function startUptime() {
    state.uptime = 0;
    clearInterval(state.uptimeInterval);
    state.uptimeInterval = setInterval(() => {
      state.uptime++;
      const m = Math.floor(state.uptime / 60);
      const s = state.uptime % 60;
      uptimeDisplay.textContent = m > 0 ? `${m}m ${s}s` : `${s}s`;
    }, 1000);
  }

  function stopUptime() {
    clearInterval(state.uptimeInterval);
    state.uptime = 0;
    uptimeDisplay.textContent = '0s';
  }

  // ========== Auto-off timer ==========
  function startAutoOff() {
    let remaining = state.autoOffSeconds;
    timerDisplay.classList.add('active');
    timerDisplay.textContent = `Auto off in ${remaining}s`;

    clearInterval(state.autoOffInterval);
    state.autoOffInterval = setInterval(() => {
      remaining--;
      timerDisplay.textContent = `Auto off in ${remaining}s`;
      if (remaining <= 0) {
        stopAutoOff();
        if (state.isOn) {
          state.isOn = false;
          stopUptime();
          applyVisuals();
          showToast('Auto off — light turned off');
        }
      }
    }, 1000);
  }

  function stopAutoOff() {
    clearInterval(state.autoOffInterval);
    timerDisplay.classList.remove('active');
    timerDisplay.textContent = '';
  }

  // ========== Event Listeners ==========

  // Click/tap on bulb
  bulbScene.addEventListener('click', toggleBulb);
  bulbScene.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      toggleBulb();
    }
  });

  // Brightness slider
  brightnessSlider.addEventListener('input', (e) => {
    state.brightness = parseInt(e.target.value);
    brightnessValue.textContent = `${state.brightness}%`;
    applyVisuals();
  });

  // Color temperature
  tempButtons.addEventListener('click', (e) => {
    const btn = e.target.closest('.temp-btn');
    if (!btn) return;
    tempButtons.querySelectorAll('.temp-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.temperature = parseInt(btn.dataset.temp);
    tempValue.textContent = btn.dataset.label;

    // Update accent color in CSS vars
    const preset = tempPresets[state.temperature];
    document.documentElement.style.setProperty('--accent', preset.accent);
    document.documentElement.style.setProperty('--border', preset.accent.replace(')', ',0.12)').replace('rgb(', 'rgba('));

    applyVisuals();
    showToast(`Color temperature: ${btn.dataset.label}`);
  });

  // Flicker toggle
  flickerToggle.addEventListener('click', () => {
    state.flicker = !state.flicker;
    flickerToggle.classList.toggle('on', state.flicker);
    flickerToggle.setAttribute('aria-checked', state.flicker);
    applyVisuals();
    showToast(state.flicker ? 'Flicker effect enabled' : 'Flicker effect disabled');
  });

  // Auto-off toggle
  autoOffToggle.addEventListener('click', () => {
    state.autoOff = !state.autoOff;
    autoOffToggle.classList.toggle('on', state.autoOff);
    autoOffToggle.setAttribute('aria-checked', state.autoOff);
    if (state.autoOff && state.isOn) {
      startAutoOff();
      showToast(`Auto off in ${state.autoOffSeconds}s`);
    } else {
      stopAutoOff();
      showToast('Auto off disabled');
    }
  });

  // Pulse toggle
  pulseToggle.addEventListener('click', () => {
    state.pulse = !state.pulse;
    pulseToggle.classList.toggle('on', state.pulse);
    pulseToggle.setAttribute('aria-checked', state.pulse);
    applyVisuals();
    showToast(state.pulse ? 'Pulse effect enabled' : 'Pulse effect disabled');
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    // Don't trigger if user is interacting with an input
    if (e.target.tagName === 'INPUT') return;

    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      toggleBulb();
    } else if (e.key === '+' || e.key === '=') {
      e.preventDefault();
      state.brightness = Math.min(100, state.brightness + 10);
      brightnessSlider.value = state.brightness;
      brightnessValue.textContent = `${state.brightness}%`;
      applyVisuals();
    } else if (e.key === '-' || e.key === '_') {
      e.preventDefault();
      state.brightness = Math.max(5, state.brightness - 10);
      brightnessSlider.value = state.brightness;
      brightnessValue.textContent = `${state.brightness}%`;
      applyVisuals();
    }
  });

  // Add pulse keyframe dynamically
  const pulseStyle = document.createElement('style');
  pulseStyle.textContent = `
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
  `;
  document.head.appendChild(pulseStyle);

  // ========== Initial render ==========
  applyVisuals();
</script>
</body>
</html>
