        id: 1,
        title: "The Quiet Revolution of Slow Design",
        excerpt: "In a world obsessed with speed, a growing movement of designers is choosing to slow down — and creating more meaningful work as a result.",
        content: `<p>There is a particular kind of exhaustion that comes from living inside interfaces designed to capture every fraction of your attention. The infinite scroll, the autoplay, the notification that demands an immediate response — each one a small theft of cognitive space. Against this backdrop, a counter-movement has been gathering momentum, not with manifestos or press releases, but with the simple act of making things that don't shout.</p>
        <blockquote>Good design is as little design as possible. Less, but better — because it concentrates on the essential aspects, and the products are not burdened with non-essentials. Back to purity, back to simplicity.</blockquote>
        <p>Slow Design, as its practitioners call it, borrows its ethos from the Slow Food movement that began in Italy during the 1980s. The core idea is deceptively simple: that the process of creation matters as much as the outcome. A chair designed over twelve months of iterative prototyping carries a different weight than one conceived and manufactured in a week. Not because the slower chair is objectively better — though it often is — but because the relationship between maker, material, and user has been given room to breathe.</p>
        <h2>Beyond Efficiency</h2>
        <p>The digital realm has been slower to embrace this philosophy, but the signs are there. Websites that load deliberately, with considered typography and generous whitespace. Applications that refuse to gamify their interfaces. Tools that treat your time as a resource to be respected rather than a commodity to be extracted. These aren't regressions — they are deliberate choices to prioritize depth over breadth, understanding over engagement metrics.</p>
        <p>What makes Slow Design radical is not its aesthetic — which can range from rustic to hyper-minimal — but its underlying assumption that people deserve environments that don't constantly demand their reaction. In an age of sensory overload, that might be the most subversive design principle of all.</p>`,
        author: "Elena Vasquez",

      {
        id: 2,
        title: "Code and Canvas: When Algorithms Meet Art",
        excerpt: "Generative art is blurring the line between programmer and painter, creating works that exist at the intersection of logic and beauty.",
        content: `<p>The first time Maya Chen ran her generative algorithm, she stared at the screen for forty minutes without moving. What emerged was not what she had programmed — not exactly — but something that contained the ghost of her instructions, transformed through thousands of iterative mutations into something she would never have conceived on her own. "It was like having a conversation with a very strange, very beautiful mind," she recalls.</p>
        <p>Generative art sits at an uneasy intersection of two traditions that have long been considered opposites: the precise, deterministic world of code and the open-ended, subjective world of visual art. But this opposition, it turns out, may have been more cultural than technical. Algorithms have always been capable of producing beauty — fractals, cellular automata, the mathematical curves of parametric design. What's changed is the sophistication of the tools and, perhaps more importantly, the willingness of the art world to pay attention.</p>
        <h2>The Artist as Gardener</h2>
        <p>The best generative artists describe their practice not as engineering but as gardening. You set the conditions — the rules, the constraints, the color palettes, the probability distributions — and then you step back and let the system grow. The artist's role shifts from creator to curator, selecting and refining from an infinite field of possible outputs. This requires a different kind of aesthetic sensibility: not the ability to compose a single image, but the ability to design a space of images and recognize which ones sing.</p>
        <p>What makes this practice genuinely new is the way it destabilizes authorship. When a piece exists as a set of instructions that produce different outputs each time they run, where exactly is the artwork? In the code? In a specific output? In the system as a whole? These questions don't have comfortable answers, and that discomfort is part of the point.</p>`,
        author: "James Okafor",

        id: 3,
        title: "Forgotten Sounds: The Vinyl Renaissance",
        excerpt: "Record sales are at their highest in decades. But the revival isn't about nostalgia — it's about a fundamentally different relationship with music.",
        content: `<p>In the back of a narrow shop in East London, rows of vinyl records stand like ancient manuscripts in a library that refuses to digitize. The owner, a retired sound engineer named David, watches a young woman carefully slide a record from its sleeve, hold it up to the light, and examine the grooves with the reverence usually reserved for old photographs. "She's checking for scratches," he whispers. "They all do that now. Took me by surprise the first time."</p>
        <p>The vinyl revival has been written about extensively, usually through the lens of nostalgia — millennials and Gen Z reaching back for an analog past they never actually experienced. But the reality is more interesting and more complicated. The people buying records today aren't trying to recreate their parents' living rooms. They're responding to something specific about the medium: its physicality, its rituals, its refusal to be background.</p>
        <h2>The Ceremony of Listening</h2>
        <p>Playing a record is a deliberate act in a way that streaming is not. You choose an album, not an algorithm's suggestion. You remove it from its sleeve, place it on the platter, set the needle. You commit to a sequence of songs in a specific order, because skipping tracks on vinyl is awkward and disruptive. This friction, far from being a defect, is the medium's greatest strength. It creates the conditions for attention.</p>
        <p>There's also the matter of sound. Audiophiles have argued for decades about whether vinyl actually sounds better than digital — the answer, technically, is that digital is more accurate. But accuracy and pleasure are not the same thing. The warmth people describe in vinyl — the slight compression, the gentle roll-off of high frequencies, the surface noise that becomes a kind of ambient texture — these aren't flaws to be corrected. They're qualities that make the listening experience feel human, imperfect, alive.</p>`,
        author: "Sofia Andersson",

        id: 4,
        title: "Architecture of Solitude",
        excerpt: "From Japanese capsule hotels to Scandinavian forest cabins, a new wave of architecture is designed not for gathering, but for being alone.",
        content: `<p>Takeda's Capsule Hotel in Osaka opened in 1979, and for decades it was viewed as a pragmatic response to urban density — a place for overworked salarymen to sleep cheaply near the office. But something unexpected has happened in the years since. The capsule, once a symbol of dehumanizing efficiency, has become a template for a new kind of architectural thinking: buildings designed to make solitude feel intentional rather than accidental.</p>
        <p>The shift reflects a broader cultural reassessment of aloneness. For most of the twentieth century, being alone was treated as a problem to be solved — through community centers, through suburban design that enforced neighborly proximity, through an entire industry of entertainment designed to fill silence. The assumption was that people, left to their own devices, would become lonely, depressed, disconnected.</p>
        <h2>Designed for One</h2>
        <p>The new solitude architecture takes the opposite approach. It starts from the premise that being alone is not a failure of social connection but a distinct and valuable mode of experience — one that deserves its own designed environments. These spaces tend to share certain qualities: they're small but not cramped, minimal but not sterile, isolated but not inaccessible. They frame a view — of a forest, of a sky, of a single window onto a street — rather than trying to contain a panorama.</p>
        <p>What these buildings offer is not isolation but intentionality. In a world where social connection is constant and ambient — the always-on group chat, the infinite social feed — choosing to be alone becomes a radical act. Architecture that supports that choice isn't withdrawing from the world. It's creating the conditions for a different kind of engagement with it.</p>`,

        id: 5,
        title: "The Last Bookshops",
        excerpt: "Independent bookstores were supposed to be dead by now. Instead, they're experiencing a quiet but unmistakable revival.",
        content: `<p>The statistics don't make sense on the surface. Between 2005 and 2010, the United States lost roughly a thousand independent bookstores. Amazon was eating the world. E-readers were supposed to make physical books obsolete. Every trend line pointed in one direction. And then, around 2012, the lines started to bend. By 2020, there were more independent bookstores in America than there had been in a decade. Nobody predicted this.</p>
        <p>The explanations vary. Some credit the "shop local" movement. Others point to the failure of e-readers to deliver on their promise — people turned out to want physical objects after all, or at least to want them alongside their digital libraries. But the most interesting explanation has less to do with books and more to do with what a bookstore actually is.</p>
        <h2>Third Places, Reimagined</h2>
        <p>A bookstore is, among other things, a third place — a space that is neither home nor work, where the primary activity is being present without a specific agenda. The decline of third places has been one of the defining social trends of the past two decades: malls closed, cafes became remote work hubs, libraries faced budget cuts. Into this vacuum, bookstores stepped, often without realizing it.</p>
        <p>The successful modern indie bookstore is not primarily a retail space. It's a community space that happens to sell books. It hosts events, curates selections with distinct personality, employs staff who read passionately and recommend fearlessly. It offers something that no algorithm can replicate: the serendipity of wandering shelves and discovering something you didn't know you were looking for.</p>`,

        id: 6,
        title: "Digital Minimalism in Practice",
        excerpt: "Cal Newport's philosophy has been widely discussed. Less examined is what happens when you actually try to live it — day by day, notification by notification.",
        content: `<p>On the first Monday of my digital minimalism experiment, I woke to silence. No phone buzzing with overnight messages, no algorithmically curated news digest, no social media notifications competing for my first conscious thoughts. The absence was so striking that it took me several minutes to identify what felt different. My morning had been stolen back, and I hadn't realized it was missing.</p>
        <p>The theory behind digital minimalism is straightforward: treat your digital tools with the same intentionality you'd bring to any other aspect of your life. Don't ban technology; audit it. Identify which tools provide genuine value, which are merely habitual, and which are actively harmful. Then redesign your digital environment around the first category and ruthlessly prune the other two.</p>
        <h2>The Thirty-Day Reset</h2>
        <p>Newport recommends a thirty-day period of complete abstinence from optional technologies — everything except essentials like email, navigation, and banking. The idea is not to suffer but to create enough distance to see clearly what you actually miss versus what you merely reach for out of habit. I tried it last autumn, and the first week was genuinely uncomfortable. My hands kept reaching for a phone that was, by design, in another room.</p>
        <p>By week three, something shifted. I started reading physical books again — not out of principle but out of genuine desire. I had longer conversations. I noticed the weather. These sound like clichés, and they are, but clichés become clichés because they describe experiences that are widely shared. The hardest part wasn't the withdrawal. It was the realization of how much time I had been spending on things that left no trace.</p>`,

        id: 7,
        title: "Wabi-Sabi and the Beauty of Imperfection",
        excerpt: "A centuries-old Japanese aesthetic philosophy offers a radical alternative to the polished perfection of modern design.",
        content: `<p>In the tea rooms of sixteenth-century Japan, a new aesthetic was being forged — not in the studios of professional artists, but in the practice of a monk named Sen no Rikyu who believed that the most profound beauty resided in things that were humble, irregular, and impermanent. His tea bowls were handmade, unevenly glazed, and deliberately simple. Next to the imported Chinese porcelain that the Japanese elite prized, they looked almost willfully plain. But Rikyu understood something that his contemporaries did not: that perfection is a dead end, and that true beauty requires the presence of time, wear, and the unpredictable.</p>
        <p>Wabi-sabi is notoriously difficult to translate. "Wabi" originally meant the loneliness of living in nature, remote from society; "sabi" meant chill, lean, or withered. Together, they describe a beauty that is incomplete, impermanent, and imperfect — and that draws its power from those very qualities rather than despite them.</p>
        <h2>Against the Polish</h2>
        <p>In a design culture obsessed with pixel-perfect interfaces, seamless gradients, and frictionless experiences, wabi-sabi feels almost subversive. It asks us to consider: what if the scratch on the table is more interesting than the table itself? What if the slightly uneven line has more character than the geometrically perfect one? What if a design that shows its making — its process, its materials, its human origins — creates a deeper connection than one that hides all evidence of effort?</p>
        <p>The practical application of wabi-sabi in modern design doesn't mean making things ugly or careless. It means allowing certain qualities to remain: the texture of raw materials, the evidence of craft, the subtle variations that come from handmade processes. It means designing objects and spaces that will age gracefully rather than fighting against time at every turn.</p>`,

        id: 8,
        title: "The Lost Art of Letter Writing",
        excerpt: "In an era of instant communication, the handwritten letter persists as an act of radical slowness — and surprising intimacy.",
        content: `<p>My grandmother's letters are stored in a shoebox in my closet. There are perhaps forty of them, written between 1987 and 2003, on thin airmail paper in her careful, slightly trembling hand. Each one begins the same way: "My dearest," followed by a paragraph about the weather in her small coastal town, then news of neighbors, then a question about my life, then a closing that always includes the phrase "write when you can." I never wrote back as often as she hoped.</p>
        <p>I think about those letters often now, in the age of WhatsApp and email and the endless scroll of text messages that accumulate like sediment in our digital lives. The difference between my grandmother's letters and the messages I exchange today is not just the medium — paper versus screen, handwriting versus typed text. The difference is in the relationship to time.</p>
        <h2>The Weight of Waiting</h2>
        <p>A letter takes time to write. Not the mechanical time of typing — which is nearly instantaneous — but the cognitive time of deciding what matters enough to include when you know the message won't arrive for days. Every word carries more weight when you can't simply send a follow-up to clarify. The letter forces a kind of editorial discipline that instant messaging makes unnecessary and therefore rare.</p>
        <p>Then there is the waiting. The days between sending and receiving, during which the letter exists in a liminal space — neither sent nor arrived, neither past nor future. This waiting is not a bug in the system of letter writing. It is the system. It creates space for anticipation, for reflection, for the gradual accumulation of thoughts that will fill the next letter. In a world that has optimized away nearly all waiting, this particular quality of the letter — its slowness as a feature rather than a flaw — feels almost sacred.</p>`,

    /* ==================== READING PROGRESS ==================== */
    function ReadingProgress() {
      const [progress, setProgress] = useState(0);
      const { pathname } = useLocation();
      const isPost = pathname.startsWith('/post/');

      useEffect(() => {
        if (!isPost) { setProgress(0); return; }
        const handleScroll = () => {
          const scrollTop = window.scrollY;
          const docHeight = document.documentElement.scrollHeight - window.innerHeight;
          if (docHeight > 0) setProgress(Math.min((scrollTop / docHeight) * 100, 100));
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, [isPost]);

      if (!isPost) return null;
      return <div className="reading-progress" style={{ width: progress + '%' }} />;
    }

    /* ==================== HEADER ==================== */
    function Header() {
      const [scrolled, setScrolled] = useState(false);
      const [mobileOpen, setMobileOpen] = useState(false);
      const location = useLocation();

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 30);
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      useEffect(() => { setMobileOpen(false); }, [location]);

      return (
        <header className={`site-header fixed top-0 left-0 right-0 z-[1000] ${scrolled ? 'scrolled' : ''}`}>
          <div className="max-w-6xl mx-auto px-5 sm:px-8 h-16 flex items-center justify-between">

            </p>
            <Link to="/" className="inline-flex items-center gap-2 px-6 py-3 rounded-lg text-sm font-semibold transition-all duration-200" style={{ background: 'var(--accent)', color: '#0d0c0b' }}
              onMouseEnter={e => e.target.style.background = 'var(--accent-hover)'}
              onMouseLeave={e => e.target.style.background = 'var(--accent)'}
            >
              <i className="fa-solid fa-house text-xs" /> Return Home
            </Link>
          </div>
        </div>
      );
    }

    /* ==================== APP ==================== */
    function App() {
      return (
        <HashRouter>
          <ScrollToTop />
          <Layout>
            <Routes>
              <Route path="/" element={<HomePage />} />
              <Route path="/post/:id" element={<PostPage />} />
              <Route path="/about" element={<AboutPage />} />
              <Route path="*" element={<NotFoundPage />} />
            </Routes>
          </Layout>
        </HashRouter>
      );
    }

    /* ==================== RENDER ==================== */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
