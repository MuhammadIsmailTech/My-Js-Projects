<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoteFlow — Smart Note Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg: #09090b; --surface: #111113; --elevated: #18181b; --card: #1e1e22;
    --hover: #27272a; --fg: #fafafa; --fg2: #a1a1aa; --fg3: #63636e;
    --accent: #f97316; --accent-h: #fb923c; --accent-m: rgba(249,115,22,.1);
    --accent-b: rgba(249,115,22,.25); --border: #26262a; --border-h: #3f3f46;
    --ok: #22c55e; --err: #ef4444; --info: #38bdf8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--fg);overflow:hidden;height:100vh}
  h1,h2,h3,h4,h5,h6,.font-heading{font-family:'Space Grotesk',sans-serif}
  ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}
  ::-webkit-scrollbar-thumb:hover{background:var(--fg3)}

  .glow-tl{position:fixed;top:-250px;left:-150px;width:500px;height:500px;background:radial-gradient(circle,rgba(249,115,22,.04),transparent 70%);pointer-events:none;z-index:0}
  .glow-br{position:fixed;bottom:-300px;right:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(249,115,22,.025),transparent 70%);pointer-events:none;z-index:0}

  /* Sidebar */
  .sidebar{width:272px;min-width:272px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:margin-left .3s cubic-bezier(.4,0,.2,1);z-index:20;position:relative}
  .sidebar.hide{margin-left:-272px}
  .note-item{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;position:relative}
  .note-item:hover{background:var(--accent-m)}
  .note-item.active{background:var(--accent-m);border-left:3px solid var(--accent)}
  .note-item .nt{font-weight:600;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
  .note-item .np{font-size:.73rem;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note-item .nd{font-size:.65rem;color:var(--fg3);margin-top:3px;opacity:.7}
  .note-item .del{position:absolute;top:10px;right:10px;opacity:0;transition:opacity .15s;color:var(--err);background:none;border:none;cursor:pointer;font-size:.75rem}
  .note-item:hover .del{opacity:.7}.note-item .del:hover{opacity:1}

  /* Inputs */
  .inp{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--fg);font-family:'DM Sans',sans-serif;font-size:.85rem;outline:none;transition:border-color .2s,box-shadow .2s}
  .inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-m)}
  .inp::placeholder{color:var(--fg3)}
  .inp-mono{font-family:'Space Grotesk',monospace;letter-spacing:-.01em}

  .btn-p{background:var(--accent);color:#09090b;border:none;border-radius:10px;padding:11px 18px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.84rem;cursor:pointer;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
  .btn-p:hover{background:var(--accent-h);transform:translateY(-1px)}.btn-p:active{transform:translateY(0)}
  .btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn-s{background:var(--card);color:var(--fg2);border:1px solid var(--border);border-radius:8px;padding:7px 13px;font-family:'DM Sans',sans-serif;font-weight:500;font-size:.78rem;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
  .btn-s:hover{border-color:var(--accent);color:var(--accent)}

  /* Tabs */
  .tab{padding:10px 16px;background:none;border:none;border-bottom:2px solid transparent;color:var(--fg3);font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:.82rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
  .tab:hover{color:var(--fg2)}.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

  /* Video card */
  .vid-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;gap:14px;padding:12px;transition:border-color .2s;animation:slideD .3s ease}
  .vid-card:hover{border-color:var(--border-h)}
  .vid-thumb{width:160px;min-width:160px;height:90px;border-radius:8px;object-fit:cover;background:var(--hover)}

  /* Progress */
  .prog-bar{height:3px;background:var(--border);border-radius:9px;overflow:hidden;margin-top:10px}
  .prog-fill{height:100%;background:var(--accent);border-radius:9px;transition:width .4s ease;width:0}
  .step-item{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--fg3);padding:3px 0}
  .step-item.done{color:var(--ok)}.step-item.active{color:var(--accent)}
  .step-item i{width:14px;text-align:center;font-size:.7rem}

  /* Summary blocks */
  .sblock{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px;line-height:1.75;font-size:.9rem}
  .sblock h3{font-family:'Space Grotesk',sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:12px;font-weight:600;display:flex;align-items:center;gap:7px}
  .sblock p{color:var(--fg);margin-bottom:6px}
  .sblock ul{padding-left:18px}.sblock li{color:var(--fg);margin-bottom:5px;line-height:1.7}
  .sblock li::marker{color:var(--accent)}

  /* Tags */
  .tag{background:var(--accent-m);color:var(--accent);border:1px solid var(--accent-b);border-radius:20px;padding:5px 13px;font-size:.78rem;font-weight:500;transition:all .15s;cursor:default;display:inline-block}
  .tag:hover{background:rgba(249,115,22,.18)}

  /* Q&A */
  .qa-q{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:500;font-size:.87rem;transition:background .15s}
  .qa-q:hover{background:var(--accent-m)}
  .qa-q i.fa-chevron-right{color:var(--accent);font-size:.7rem;transition:transform .25s}
  .qa-q.open i.fa-chevron-right{transform:rotate(90deg)}
  .qa-a{max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s;padding:0 18px;color:var(--fg2);font-size:.86rem;line-height:1.7;border-top:0 solid var(--border)}
  .qa-a.open{max-height:250px;padding:14px 18px;border-top:1px solid var(--border)}

  /* Transcript */
  .ts-item{padding:8px 0;border-bottom:1px solid var(--border);display:flex;gap:12px;font-size:.86rem;cursor:pointer;transition:background .15s;padding-left:4px;padding-right:4px;border-radius:6px}
  .ts-item:hover{background:var(--accent-m)}
  .ts-time{color:var(--accent);font-family:'Space Grotesk',monospace;font-size:.75rem;font-weight:600;min-width:55px;padding-top:2px;flex-shrink:0}
  .ts-text{color:var(--fg2);line-height:1.6}

  /* Mind map */
  .mm-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;position:relative;overflow:hidden;min-height:380px}
  .mm-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  .mm-svg line{stroke:var(--border-h);stroke-width:1.5;stroke-dasharray:4 3}
  .mm-node{position:absolute;background:var(--elevated);border:1.5px solid var(--border-h);border-radius:20px;padding:8px 16px;font-size:.78rem;font-weight:500;color:var(--fg);z-index:2;user-select:none;white-space:nowrap;transition:box-shadow .2s,border-color .2s,transform .15s;cursor:default}
  .mm-node:hover{border-color:var(--accent);box-shadow:0 0 24px rgba(249,115,22,.1);transform:scale(1.04)}
  .mm-node.center{background:var(--accent);color:#09090b;font-weight:700;border-color:var(--accent);font-size:.85rem;border-radius:24px}
  .mm-node.center:hover{background:var(--accent-h);box-shadow:0 0 30px rgba(249,115,22,.2)}

  /* Numbered point */
  .kp-num{background:var(--accent);color:#09090b;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;margin-top:1px;font-family:'Space Grotesk',sans-serif}

  /* Empty state */
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:40px}
  .empty-icon{width:72px;height:72px;border-radius:18px;background:var(--accent-m);display:flex;align-items:center;justify-content:center;margin-bottom:18px;animation:bob 3s ease-in-out infinite}
  .empty-icon i{font-size:1.8rem;color:var(--accent)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes slideD{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .fade-up{animation:fadeUp .35s ease both}

  /* Toast */
  .toast-c{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--elevated);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:.82rem;display:flex;align-items:center;gap:9px;animation:tIn .25s ease,tOut .25s ease 2.7s forwards;box-shadow:0 8px 32px rgba(0,0,0,.5);min-width:240px}
  .toast.ok i{color:var(--ok)}.toast.err i{color:var(--err)}.toast.inf i{color:var(--info)}
  @keyframes tIn{from{transform:translateX(80px);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes tOut{to{opacity:0;transform:translateY(-8px)}}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
  .modal-bg.open{opacity:1;pointer-events:all}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;max-width:440px;width:92%;transform:scale(.92);transition:transform .25s}
  .modal-bg.open .modal-box{transform:scale(1)}

  .spinner{width:16px;height:16px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:spin .5s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Stat pill */
  .stat{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;color:var(--fg3);background:var(--card);border:1px solid var(--border);border-radius:6px;padding:4px 10px}
  .stat b{color:var(--fg);font-family:'Space Grotesk',sans-serif;font-weight:600}

  .search-w{position:relative}.search-w i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg3);font-size:.72rem}
  .search-w .inp{padding-left:30px;font-size:.8rem;border-radius:8px}

  @media(max-width:768px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50}.sidebar.hide{margin-left:-272px}
    .vid-card{flex-direction:column}.vid-thumb{width:100%;min-width:unset;height:160px}
  }
</style>
</head>
<body>
<div class="glow-tl"></div><div class="glow-br"></div>
<div class="toast-c" id="toasts"></div>

<!-- Export Modal -->
<div class="modal-bg" id="expModal">
  <div class="modal-box">
    <h3 class="font-heading" style="font-size:1.05rem;font-weight:700;margin-bottom:14px">Export Notes</h3>
    <p style="color:var(--fg3);font-size:.85rem;margin-bottom:18px;line-height:1.6">Choose a format to download your analyzed notes.</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn-s" style="padding:13px 16px;justify-content:flex-start" onclick="doExport('md')"><i class="fa-brands fa-markdown" style="font-size:1.1rem;color:var(--accent)"></i><div><div style="font-weight:600;color:var(--fg)">Markdown</div><div style="font-size:.7rem;color:var(--fg3)">.md format</div></div></button>
      <button class="btn-s" style="padding:13px 16px;justify-content:flex-start" onclick="doExport('txt')"><i class="fa-solid fa-file-lines" style="font-size:1.1rem;color:var(--accent)"></i><div><div style="font-weight:600;color:var(--fg)">Plain Text</div><div style="font-size:.7rem;color:var(--fg3)">.txt format</div></div></button>
      <button class="btn-s" style="padding:13px 16px;justify-content:flex-start" onclick="doExport('json')"><i class="fa-solid fa-code" style="font-size:1.1rem;color:var(--accent)"></i><div><div style="font-weight:600;color:var(--fg)">JSON</div><div style="font-size:.7rem;color:var(--fg3)">Structured data</div></div></button>
    </div>
    <button class="btn-s" style="margin-top:14px;width:100%;justify-content:center" onclick="closeModal()">Cancel</button>
  </div>
</div>

<!-- App -->
<div style="display:flex;height:100vh;position:relative;z-index:1">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div style="padding:18px 14px;border-bottom:1px solid var(--border);flex-shrink:0">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:9px">
          <div style="width:30px;height:30px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center"><i class="fa-solid fa-bolt" style="color:#09090b;font-size:.82rem"></i></div>
          <span class="font-heading" style="font-weight:700;font-size:1rem">NoteFlow</span>
        </div>
        <button onclick="toggleSB()" style="background:none;border:none;color:var(--fg3);cursor:pointer;padding:4px" title="Collapse"><i class="fa-solid fa-chevron-left" style="font-size:.85rem"></i></button>
      </div>
      <button class="btn-p" style="width:100%;justify-content:center" onclick="newNote()"><i class="fa-solid fa-plus" style="font-size:.7rem"></i> New Note</button>
    </div>
    <div style="padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0">
      <div style="font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);margin-bottom:8px;font-weight:600" class="font-heading">Folders</div>
      <div id="folderList"></div>
    </div>
    <div style="padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0">
      <div class="search-w"><i class="fa-solid fa-magnifying-glass"></i><input class="inp" style="width:100%" placeholder="Search notes..." id="searchInp" oninput="renderNotes()"></div>
    </div>
    <div style="flex:1;overflow-y:auto" id="notesList"></div>
    <div style="padding:12px 14px;border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:.72rem;color:var(--fg3)" id="noteCount">0 notes</span>
      <button onclick="openModal()" style="background:none;border:none;color:var(--fg3);cursor:pointer;font-size:.82rem" title="Export"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>
    </div>
  </aside>

  <!-- Main -->
  <main style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0">

    <!-- Top bar -->
    <header style="padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--surface)">
      <button onclick="toggleSB()" style="background:none;border:none;color:var(--fg3);cursor:pointer;font-size:.95rem" id="sbToggle"><i class="fa-solid fa-bars"></i></button>
      <input id="noteTitle" placeholder="Untitled Note" style="background:none;border:none;color:var(--fg);font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:600;outline:none;flex:1;min-width:0" oninput="updateTitle()">
      <select id="folderSel" style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 8px;color:var(--fg2);font-size:.78rem;outline:none;cursor:pointer" onchange="updateFolder()"></select>
      <button class="btn-s" onclick="openModal()" title="Export"><i class="fa-solid fa-download" style="font-size:.72rem"></i></button>
      <button class="btn-s" onclick="copyAll()" title="Copy"><i class="fa-solid fa-copy" style="font-size:.72rem"></i></button>
    </header>

    <!-- Input -->
    <section style="padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface)">
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <input class="inp inp-mono" style="flex:1" id="urlInp" placeholder="Paste YouTube URL, article link, or any URL...">
        <button class="btn-p" id="extractBtn" onclick="extract()"><i class="fa-solid fa-wand-magic-sparkles" style="font-size:.75rem"></i> Extract</button>
      </div>
      <div id="vidPreview"></div>
      <div id="progressArea" style="display:none"></div>
      <textarea class="inp" style="width:100%;min-height:100px;max-height:200px;resize:vertical;line-height:1.6;margin-top:10px" id="txtInp" placeholder="Or paste text directly — articles, notes, transcripts, papers..."></textarea>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
        <div id="statsBar" style="display:flex;gap:6px;flex-wrap:wrap"></div>
        <div style="display:flex;gap:5px">
          <button class="btn-s" onclick="loadSample()"><i class="fa-solid fa-flask" style="font-size:.68rem"></i> Sample</button>
          <button class="btn-s" onclick="clearInp()"><i class="fa-solid fa-eraser" style="font-size:.68rem"></i> Clear</button>
        </div>
      </div>
    </section>

    <!-- Tabs -->
    <nav style="display:flex;border-bottom:1px solid var(--border);padding:0 20px;flex-shrink:0;background:var(--surface);overflow-x:auto" id="tabBar">
      <button class="tab on" data-t="transcript" onclick="switchTab('transcript')"><i class="fa-solid fa-closed-captioning" style="font-size:.72rem"></i> Transcript</button>
      <button class="tab" data-t="summary" onclick="switchTab('summary')"><i class="fa-solid fa-align-left" style="font-size:.72rem"></i> Summary</button>
      <button class="tab" data-t="keypoints" onclick="switchTab('keypoints')"><i class="fa-solid fa-list-check" style="font-size:.72rem"></i> Key Points</button>
      <button class="tab" data-t="mindmap" onclick="switchTab('mindmap')"><i class="fa-solid fa-diagram-project" style="font-size:.72rem"></i> Mind Map</button>
      <button class="tab" data-t="qa" onclick="switchTab('qa')"><i class="fa-solid fa-circle-question" style="font-size:.72rem"></i> Q&A</button>
      <button class="tab" data-t="outline" onclick="switchTab('outline')"><i class="fa-solid fa-sitemap" style="font-size:.72rem"></i> Outline</button>
    </nav>

    <!-- Output -->
    <section style="flex:1;overflow-y:auto;padding:20px" id="outputArea">
      <div style="max-width:780px;margin:0 auto" id="output">
        <div class="empty" id="emptyState">
          <div class="empty-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
          <h2 class="font-heading" style="font-size:1.2rem;font-weight:600;margin-bottom:6px">Ready to Extract</h2>
          <p style="color:var(--fg3);font-size:.87rem;max-width:360px;line-height:1.6">Paste a YouTube URL to get the full transcript, or any article link to extract its content. Then analyze with one click.</p>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
// ===== CONFIG =====
const INSTANCES = [
  'https://inv.nadeko.net','https://invidious.nerdvpn.de','https://iv.ggtyler.dev',
  'https://invidious.jing.rocks','https://invidious.privacyredirect.com'
];
const JINA = 'https://r.jina.ai/';
const FOLDERS = [
  {id:'all',name:'All Notes',icon:'fa-layer-group',color:'var(--accent)'},
  {id:'unclassified',name:'Unclassified',icon:'fa-inbox',color:'var(--fg3)'},
  {id:'research',name:'Research',icon:'fa-flask',color:'var(--ok)'},
  {id:'lectures',name:'Lectures',icon:'fa-graduation-cap',color:'var(--info)'},
  {id:'meetings',name:'Meetings',icon:'fa-users',color:'var(--err)'},
  {id:'articles',name:'Articles',icon:'fa-newspaper',color:'#f59e0b'}
];
const STOPS = new Set('the a an and or but in on at to for of with by from is it this that are was were be been being have has had do does did will would could should may might can shall not no nor so if then than too very just about above after again all also am any as because before below between both during each few further get got he her here him his how i into its me more most my myself now only other our out over own same she some such there these they those through under up us we what when where which while who whom why you your much many well like even back still way take come make know see look think say said one two new first last long great little old big high small large next early young important public good another however since around every must though part upon yet within without per using used use based including'.split(' '));

// ===== STATE =====
let notes = [], curId = null, curTab = 'transcript', curFolder = 'all';
let analysis = null, transcript = null, videoInfo = null;

// ===== URL UTILS =====
function ytId(url) {
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/|v\/))([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}
function isYT(url) { return !!ytId(url); }

// ===== EXTRACTION =====
async function fetchCORS(url) {
  try { const r = await fetch(url, {signal: AbortSignal.timeout(8000)}); if(r.ok) return await r.text(); } catch{}
  try { const r = await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url), {signal: AbortSignal.timeout(10000)}); if(r.ok) return await r.text(); } catch{}
  throw new Error('Fetch failed');
}

async function getVideoInfo(id) {
  // oEmbed is reliable and CORS-friendly
  try {
    const r = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`, {signal: AbortSignal.timeout(5000)});
    if(r.ok) return await r.json();
  } catch{}
  return null;
}

async function getCaptionsList(id) {
  for (const inst of INSTANCES) {
    try {
      const r = await fetch(`${inst}/api/v1/captions/${id}`, {signal: AbortSignal.timeout(6000)});
      if(r.ok) { const d = await r.json(); if(d.captions?.length) return {captions: d.captions, base: inst}; }
    } catch{}
  }
  // Fallback with CORS proxy
  for (const inst of INSTANCES) {
    try {
      const txt = await fetchCORS(`${inst}/api/v1/captions/${id}`);
      const d = JSON.parse(txt); if(d.captions?.length) return {captions: d.captions, base: inst};
    } catch{}
  }
  return null;
}

async function getCaptionText(base, id, label) {
  const url = `${base}/api/v1/captions/${id}?label=${encodeURIComponent(label)}`;
  try {
    const r = await fetch(url, {signal: AbortSignal.timeout(10000)});
    if(r.ok) return await r.text();
  } catch{}
  return await fetchCORS(url);
}

function parseVTT(vtt) {
  const lines = vtt.split('\n'), caps = [];
  let cur = null;
  for (const line of lines) {
    const tm = line.match(/(\d{2}:\d{2}:\d{2})[.,]\d{3}\s*-->\s*(\d{2}:\d{2}:\d{2})[.,]\d{3}/);
    if (tm) { cur = {start: tm[1], end: tm[2], text: ''}; caps.push(cur); }
    else if (cur && line.trim() && !line.startsWith('WEBVTT') && !line.startsWith('Kind:') && !line.startsWith('Language:')) {
      cur.text += (cur.text ? ' ' : '') + line.replace(/<[^>]+>/g, '').trim();
    }
  }
  return caps.filter(c => c.text.length > 0);
}

function fmtTime(t) {
  const p = t.split(':'); const h=+p[0], m=+p[1], s=+p[2];
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}

async function extractYT(url) {
  const id = ytId(url);
  showProgress([
    {text:'Fetching video info...', icon:'fa-circle-info'},
    {text:'Finding available transcripts...', icon:'fa-closed-captioning'},
    {text:'Downloading transcript...', icon:'fa-download'},
    {text:'Processing complete', icon:'fa-check'}
  ]);
  setStep(0, 'active');

  // Step 1: Video info
  const info = await getVideoInfo(id);
  videoInfo = info;
  if (info) renderVidCard(info);
  setStep(0, 'done'); setStep(1, 'active');

  // Step 2: Get captions list
  const capData = await getCaptionsList(id);
  if (!capData || !capData.captions.length) {
    setStep(1, 'done'); setStep(2, 'err');
    throw new Error('No captions available for this video. The video may not have subtitles enabled.');
  }

  // Find English caption, fallback to first available
  let cap = capData.captions.find(c => c.label.toLowerCase().includes('english')) || capData.captions[0];
  setStep(1, 'done'); setStep(2, 'active');

  // Step 3: Download caption
  const vtt = await getCaptionText(capData.base, id, cap.label);
  transcript = parseVTT(vtt);

  if (!transcript.length) throw new Error('Transcript was empty after parsing.');

  const fullText = transcript.map(c => c.text).join(' ');
  document.getElementById('txtInp').value = fullText;
  setStep(2, 'done'); setStep(3, 'done');
  return {text: fullText, captionLabel: cap.label};
}

async function extractArticle(url) {
  showProgress([
    {text:'Connecting to page...', icon:'fa-globe'},
    {text:'Extracting content...', icon:'fa-file-lines'},
    {text:'Processing complete', icon:'fa-check'}
  ]);
  setStep(0, 'active');

  const r = await fetch(JINA + url, {
    headers: {'Accept': 'text/markdown', 'X-Return-Format': 'markdown'},
    signal: AbortSignal.timeout(15000)
  });
  if (!r.ok) throw new Error(`Extraction failed (HTTP ${r.status}). The page may block automated access.`);
  const md = await r.text();
  setStep(0, 'done'); setStep(1, 'active');

  // Convert markdown to plain text roughly
  const text = md.replace(/#{1,6}\s/g, '').replace(/\*\*/g, '').replace(/\*/g, '').replace(/```[\s\S]*?```/g, '').replace(/`([^`]+)`/g, '$1').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/!\[([^\]]*)\]\([^)]+\)/g, '').replace(/[-*+>]\s/g, '').replace(/\n{3,}/g, '\n\n').trim();

  if (text.length < 50) throw new Error('Extracted content was too short. The page may require JavaScript or have blocked access.');

  // Create fake transcript from paragraphs
  const paragraphs = text.split('\n\n').filter(p => p.trim().length > 0);
  transcript = paragraphs.map((p, i) => ({
    start: `00:${String(Math.floor(i*2)).padStart(2,'0')}:00`,
    end: `00:${String(Math.floor((i+1)*2)).padStart(2,'0')}:00`,
    text: p.trim()
  }));

  document.getElementById('txtInp').value = text;
  setStep(1, 'done'); setStep(2, 'done');
  return {text, captionLabel: 'Article Content'};
}

async function extract() {
  const url = document.getElementById('urlInp').value.trim();
  const txt = document.getElementById('txtInp').value.trim();

  const btn = document.getElementById('extractBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Extracting...';

  try {
    let result;
    if (isYT(url)) {
      result = await extractYT(url);
    } else if (url.match(/^https?:\/\//)) {
      result = await extractArticle(url);
    } else if (txt.length >= 50) {
      // Just analyze the text directly
      transcript = txt.split(/\n+/).filter(l => l.trim()).map((l, i) => ({
        start: `00:${String(i).padStart(2,'0')}:00`, end: `00:${String(i+1).padStart(2,'0')}:00`, text: l.trim()
      }));
      result = {text: txt, captionLabel: 'Pasted Text'};
    } else {
      throw new Error('Please paste a URL or at least 50 characters of text.');
    }

    // Auto-set title
    if (!document.getElementById('noteTitle').value.trim()) {
      document.getElementById('noteTitle').value = videoInfo?.title || result.text.substring(0, 60).replace(/\n/g, ' ') + '...';
    }

    // Run analysis
    analysis = analyzeText(result.text);
    renderOutput();
    updateStats(result.text);
    saveCurrentNote(result.text);
    toast(`${result.captionLabel} extracted — ${transcript.length} segments`, 'ok');

    // Auto-switch to transcript tab
    switchTab('transcript');

  } catch (e) {
    toast(e.message, 'err');
    console.error(e);
  }

  btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles" style="font-size:.75rem"></i> Extract';
}

// ===== NLP ENGINE =====
function tokenize(t) { return t.toLowerCase().replace(/[^a-z0-9\s'-]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOPS.has(w)); }
function getSentences(t) { return t.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.length>20); }

function analyzeText(text) {
  const sents = getSentences(text);
  const words = tokenize(text);
  const freq = {}; words.forEach(w => freq[w]=(freq[w]||0)+1);

  const scoreSent = (s) => {
    const w = tokenize(s); if(!w.length) return 0;
    let sc = w.reduce((a,ww) => a+(freq[ww]||0), 0)/w.length;
    const idx = sents.indexOf(s);
    if(idx===0) sc*=1.4; else if(idx===sents.length-1) sc*=1.2;
    if(w.length>=8&&w.length<=25) sc*=1.1;
    return sc;
  };

  // Summary: top 4 sentences by score, reordered
  const summarySents = sents.length<=4 ? [...sents] :
    sents.map((s,i)=>({s,sc:scoreSent(s),i})).sort((a,b)=>b.sc-a.sc).slice(0,4).sort((a,b)=>a.i-b.i).map(x=>x.s);

  // Key points: top 8, deduplicated
  const kpRaw = sents.map((s,i)=>({s,sc:scoreSent(s),i})).sort((a,b)=>b.sc-a.sc);
  const keyPoints = [];
  for (const item of kpRaw) {
    if(keyPoints.length>=8) break;
    const similar = keyPoints.some(p => {
      const a=new Set(tokenize(p.s)), b=new Set(tokenize(item.s));
      return [...a].filter(w=>b.has(w)).length/Math.max(a.size,1) > 0.6;
    });
    if(!similar) keyPoints.push(item);
  }
  keyPoints.sort((a,b)=>a.i-b.i);

  // Key phrases: bigrams + unigrams
  const bigrams = {};
  for(let i=0;i<words.length-1;i++){const bg=words[i]+' '+words[i+1];bigrams[bg]=(bigrams[bg]||0)+1;}
  const phrases = [];
  Object.entries(bigrams).filter(([,c])=>c>=2).forEach(([p,c])=>phrases.push({p,c}));
  Object.entries(freq).filter(([,c])=>c>=3).forEach(([p,c])=>phrases.push({p,c}));
  phrases.sort((a,b)=>b.c-a.c);
  const keyPhrases = phrases.slice(0,14).map(x=>x.p);

  // Outline: paragraph-level
  const outline = text.split(/\n\n+/).filter(p=>p.trim().length>0).map((para,idx)=>{
    const ps = getSentences(para); if(!ps.length) return null;
    const pw = tokenize(para); const pf={}; pw.forEach(w=>pf[w]=(pf[w]||0)+1);
    let best=ps[0],bsc=0; ps.forEach(s=>{const sc=scoreSent(s);if(sc>bsc){bsc=sc;best=s;}});
    return {section:`Section ${idx+1}`, topic:best, points:ps.filter(s=>s!==best).slice(0,3)};
  }).filter(Boolean);

  // Q&A
  const qaSrc = kpRaw.slice(0,12);
  const qPats = [
    s=>`What is the significance of ${subj(s)}?`,
    s=>`How does ${subj(s)} relate to the main topic?`,
    s=>`Why is ${subj(s)} important in this context?`,
    s=>`What role does ${subj(s)} play?`,
    s=>`Can you explain ${subj(s)} based on the content?`,
    s=>`What are the key aspects of ${subj(s)}?`,
  ];
  const qa = [];
  qaSrc.forEach((item,i) => {
    if(qa.length>=6) return;
    qa.push({q: qPats[i%qPats.length](item.s), a: item.s});
  });

  return {summary: summarySents, keyPoints: keyPoints.map(x=>x.s), keyPhrases, outline, qa, rawText: text};
}

function subj(s) {
  const w = tokenize(s); if(!w.length) return 'this concept';
  for(let i=0;i<Math.min(w.length-1,5);i++) if(w[i].length>4&&w[i+1].length>3) return w[i]+' '+w[i+1];
  return w[0];
}

// ===== MIND MAP =====
function renderMindMap(phrases) {
  const wrap = document.getElementById('mmWrap');
  if (!wrap || !phrases.length) return;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const cx = W/2, cy = H/2, R = Math.min(W,H)*.34;
  const count = Math.min(phrases.length-1, 8);

  // SVG lines
  let svg = `<svg class="mm-svg" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`;
  for (let i=0;i<count;i++) {
    const a = 2*Math.PI*i/count - Math.PI/2;
    const nx = cx+R*Math.cos(a), ny = cy+R*Math.sin(a);
    svg += `<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}"/>`;
    // Glow line
    svg += `<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="rgba(249,115,22,0.08)" stroke-width="6"/>`;
  }
  svg += '</svg>';
  wrap.innerHTML = svg;

  // Center node
  const cn = document.createElement('div');
  cn.className = 'mm-node center';
  cn.textContent = phrases[0].length > 22 ? phrases[0].substring(0,20)+'...' : phrases[0];
  cn.style.left = (cx - cn.offsetWidth/2 - 10) + 'px';
  cn.style.top = (cy - 16) + 'px';
  wrap.appendChild(cn);

  // Child nodes
  for (let i=0;i<count;i++) {
    const a = 2*Math.PI*i/count - Math.PI/2;
    const nx = cx+R*Math.cos(a), ny = cy+R*Math.sin(a);
    const node = document.createElement('div');
    node.className = 'mm-node';
    const txt = phrases[i+1].length > 24 ? phrases[i+1].substring(0,22)+'...' : phrases[i+1];
    node.textContent = txt;
    node.style.left = (nx - 50) + 'px';
    node.style.top = (ny - 14) + 'px';
    wrap.appendChild(node);
  }
}

function saveCurrentNote(text) {
  const title = document.getElementById('noteTitle').value.trim() || 'Untitled Note';
  if (curId) {
    const n = notes.find(x=>x.id===curId);
    if (n) { n.title=title; n.rawText=text; n.analysis=analysis; n.transcript=transcript; n.videoInfo=videoInfo; n.updatedAt=Date.now(); }
  } else {
    const n = {id:'n_'+Date.now(), title, rawText:text, analysis, transcript, videoInfo, folder:'unclassified', createdAt:Date.now(), updatedAt:Date.now()};
    notes.unshift(n); curId = n.id;
  }
  save(); renderNotes();
}

function loadNote(id) {
  const n = notes.find(x=>x.id===id); if(!n) return;
  curId = n.id;
  document.getElementById('noteTitle').value = n.title;
  document.getElementById('txtInp').value = n.rawText;
  document.getElementById('urlInp').value = '';
  document.getElementById('folderSel').value = n.folder||'unclassified';
  analysis = n.analysis||null;
  transcript = n.transcript||null;
  videoInfo = n.videoInfo||null;
  if (videoInfo) renderVidCard(videoInfo); else clearVidCard();
  hideProgress();
  if (n.rawText) updateStats(n.rawText); else document.getElementById('statsBar').innerHTML='';
  renderOutput(); renderNotes();
}

function newNote() {
  curId=null; analysis=null; transcript=null; videoInfo=null;
  document.getElementById('noteTitle').value='';
  document.getElementById('txtInp').value='';
  document.getElementById('urlInp').value='';
  document.getElementById('statsBar').innerHTML='';
  document.getElementById('folderSel').value='unclassified';
  clearVidCard(); hideProgress(); renderOutput(); renderNotes();
  document.getElementById('urlInp').focus();
}

function delNote(id) {
  notes = notes.filter(n=>n.id!==id);
  if(curId===id) newNote();
  save(); renderNotes(); toast('Note deleted','inf');
}

function updateTitle() {
  if(!curId) return; const n=notes.find(x=>x.id===curId);
  if(n){n.title=document.getElementById('noteTitle').value.trim()||'Untitled';n.updatedAt=Date.now();save();renderNotes();}
}
function updateFolder() {
  if(!curId) return; const n=notes.find(x=>x.id===curId);
  if(n){n.folder=document.getElementById('folderSel').value;n.updatedAt=Date.now();save();renderNotes();}
}

// ===== TABS =====
function switchTab(t) {
  curTab = t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  renderOutput();
}

// ===== EXPORT =====
function openModal() { if(!analysis){toast('Analyze content first','err');return;} document.getElementById('expModal').classList.add('open'); }
function closeModal() { document.getElementById('expModal').classList.remove('open'); }
function doExport(fmt) {
  if(!analysis) return;
  const r=analysis, title=document.getElementById('noteTitle').value;
  let content, name, type;
  if(fmt==='md') {
    content=`# ${title}\n\n## Summary\n\n${r.summary.join('\n\n')}\n\n## Key Points\n\n${r.keyPoints.map((p,i)=>`${i+1}. ${p}`).join('\n')}\n\n## Key Phrases\n\n${r.keyPhrases.join(', ')}\n\n## Study Questions\n\n${r.qa.map(q=>`**Q: ${q.q}**\nA: ${q.a}`).join('\n\n')}\n\n## Outline\n\n${r.outline.map(s=>`### ${s.section}\n${s.topic}\n${s.points.map(p=>'- '+p).join('\n')}`).join('\n\n')}\n`;
    name='note.md'; type='text/markdown';
  } else if(fmt==='txt') {
    content=`${title}\n${'='.repeat(40)}\n\nSUMMARY:\n${r.summary.join('\n\n')}\n\nKEY POINTS:\n${r.keyPoints.map((p,i)=>`${i+1}. ${p}`).join('\n')}\n\nKEY PHRASES: ${r.keyPhrases.join(', ')}\n\nQUESTIONS:\n${r.qa.map(q=>`Q: ${q.q}\nA: ${q.a}`).join('\n\n')}`;
    name='note.txt'; type='text/plain';
  } else {
    content=JSON.stringify({title,generated:new Date().toISOString(),summary:r.summary,keyPoints:r.keyPoints,keyPhrases:r.keyPhrases,qa:r.qa,outline:r.outline},null,2);
    name='note.json'; type='application/json';
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click();
  closeModal(); toast('Exported as '+fmt.toUpperCase(),'ok');
}

function copyAll() {
  if(!analysis){toast('Nothing to copy','err');return;}
  const r=analysis;
  navigator.clipboard.writeText(`Summary:\n${r.summary.join('\n')}\n\nKey Points:\n${r.keyPoints.map((p,i)=>`${i+1}. ${p}`).join('\n')}\n\nPhrases: ${r.keyPhrases.join(', ')}`).then(()=>toast('Copied','ok')).catch(()=>toast('Copy failed','err'));
}
function copyTranscript() {
  if(!transcript){toast('No transcript','err');return;}
  navigator.clipboard.writeText(transcript.map(c=>`[${fmtTime(c.start)}] ${c.text}`).join('\n')).then(()=>toast('Transcript copied','ok')).catch(()=>toast('Copy failed','err'));
}
function copySeg(i) {
  if(!transcript||!transcript[i]) return;
  navigator.clipboard.writeText(transcript[i].text).then(()=>toast('Segment copied','ok'));
}

// ===== UTILS =====
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function wc(t) { return t.split(/\s+/).filter(w=>w.length>0).length; }
function fdate(ts) { const d=Date.now()-ts; if(d<6e4) return 'Just now'; if(d<36e5) return Math.floor(d/6e4)+'m ago'; if(d<864e5) return Math.floor(d/36e5)+'h ago'; if(d<6048e5) return Math.floor(d/864e5)+'d ago'; return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function toast(msg, type='inf') {
  const c=document.getElementById('toasts'), t=document.createElement('div');
  t.className='toast '+type;
  const icons={ok:'fa-circle-check',err:'fa-circle-xmark',inf:'fa-circle-info'};
  t.innerHTML=`<i class="fa-solid ${icons[type]||icons.inf}"></i>${esc(msg)}`;
  c.appendChild(t); setTimeout(()=>t.remove(),3000);
}
function updateStats(text) {
  document.getElementById('statsBar').innerHTML = `<span class="stat"><b>${wc(text)}</b> words</span><span class="stat"><b>${getSentences(text).length}</b> sentences</span><span class="stat"><b>${Math.max(1,Math.round(wc(text)/200))}</b> min</span>`;
}
function toggleSB() { document.getElementById('sidebar').classList.toggle('hide'); }
function clearInp() { document.getElementById('txtInp').value=''; document.getElementById('urlInp').value=''; clearVidCard(); hideProgress(); document.getElementById('statsBar').innerHTML=''; }
function loadSample() {
  document.getElementById('urlInp').value = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
  toast('Sample YouTube URL loaded — click Extract','inf');
}

// ===== PERSISTENCE =====
function save() {
  try { localStorage.setItem('nf_notes', JSON.stringify(notes.map(n=>({id:n.id,title:n.title,rawText:n.rawText,analysis:n.analysis,transcript:n.transcript,videoInfo:n.videoInfo,folder:n.folder,createdAt:n.createdAt,updatedAt:n.updatedAt})))) } catch{}
}
function load() { try { const d=JSON.parse(localStorage.getItem('nf_notes')); if(Array.isArray(d)) notes=d; } catch{ notes=[]; } }

// ===== INIT =====
function init() {
  load();
  document.getElementById('folderSel').innerHTML = FOLDERS.filter(f=>f.id!=='all').map(f=>`<option value="${f.id}">${f.name}</option>`).join('');
  renderFolders(); renderNotes(); renderOutput();

  document.getElementById('txtInp').addEventListener('input', function() {
    const t=this.value.trim();
    if(t.length>0) document.getElementById('statsBar').innerHTML=`<span class="stat"><b>${wc(t)}</b> words</span><span class="stat" style="font-size:.7rem;color:var(--fg3)">Ctrl+Enter to analyze</span>`;
    else document.getElementById('statsBar').innerHTML='';
  });

  document.addEventListener('keydown', e => {
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();extract();}
    if((e.ctrlKey||e.metaKey)&&e.key==='n'){e.preventDefault();newNote();}
    if(e.key==='Escape') closeModal();
  });

  // URL paste detection - auto-detect YouTube
  document.getElementById('urlInp').addEventListener('paste', function() {
    setTimeout(() => {
      const v = this.value.trim();
      if (isYT(v)) {
        getVideoInfo(ytId(v)).then(info => { if(info) { videoInfo=info; renderVidCard(info); } }).catch(()=>{});
      }
    }, 50);
  });
}

init();
</script>
</body>
</html>
